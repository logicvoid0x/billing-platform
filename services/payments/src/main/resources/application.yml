spring:
  application:
    name: payments
  threads:
    virtual:
      enabled: true

server:
  port: 8085 # the Stripe CLI forwards here (infra/docker-compose.yml, profile stripe)

payments:
  # Off by default: needs STRIPE_WEBHOOK_SECRET and the balance-ledger service.
  enabled: false
  ledger-url: http://localhost:8086
  stripe:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
