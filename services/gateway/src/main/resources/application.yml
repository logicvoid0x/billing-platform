spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true

gateway:
  # Off by default: the request path needs the shard, Kafka, the inference host and the catalog.
  enabled: false
  host-id: gw-local-1
  home-region: local
  shard-target: localhost:9099
  upstream-url: http://localhost:8080
  kafka-bootstrap-servers: localhost:19092
  per-minute: 600
  chunk-tokens: 2048
  catalog-url: http://localhost:8090
