# Iceberg REST catalog of the raw usage archive, for UsageReplayJob (local environment).
# Same catalog as infra/connect/connectors/usage-raw-iceberg.json, without the "iceberg.catalog." prefix.
# Host names resolve inside the compose network; from the host use localhost and the published ports.
uri=http://iceberg-rest:8181
io-impl=org.apache.iceberg.aws.s3.S3FileIO
warehouse=s3://archive/warehouse
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.access-key-id=billing
s3.secret-access-key=billing-local-secret
client.region=us-east-1
