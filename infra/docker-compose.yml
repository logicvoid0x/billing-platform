# Local environment for the billing platform: every external dependency, one command.
#   make up            single-broker Kafka and everything else
#   make up-multi      adds the 3-broker Kafka profile (replication 3, min.insync.replicas 2)
#   make up-stripe     adds the Stripe CLI webhook forwarder (needs STRIPE_API_KEY)
# Image tags are pinned; they were checked to exist on 2026-11-01 (docs/decisions/0003-local-env.md).
# Credentials here are local-only defaults, never used outside this file.
name: billing

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: billing
  AWS_SECRET_ACCESS_KEY: billing-local-secret
  AWS_REGION: us-east-1

services:
  # ---------------------------------------------------------------- Kafka (KRaft, 1 broker)
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---------------------------------------------------------------- Kafka (KRaft, 3 brokers)
  kafka-1: &kafka-multi
    profiles: [multi-broker]
    image: apache/kafka:4.3.2
    hostname: kafka-1
    ports:
      - "29092:29092"
    environment: &kafka-multi-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: bIlLiNgPlAtFoRm3BrOkEr
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-2:
    <<: *kafka-multi
    hostname: kafka-2
    ports:
      - "29093:29093"
    environment:
      <<: *kafka-multi-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,HOST://localhost:29093
  kafka-3:
    <<: *kafka-multi
    hostname: kafka-3
    ports:
      - "29094:29094"
    environment:
      <<: *kafka-multi-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,HOST://localhost:29094

  # ---------------------------------------------------------------- S3-compatible object store
  # SeaweedFS replaces MinIO, whose community images are no longer published.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  create-buckets:
    image: chrislusf/seaweedfs:4.51
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in archive flink; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
        done
    restart: "no"

  # ---------------------------------------------------------------- Iceberg REST catalog
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      create-buckets:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://archive/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # ---------------------------------------------------------------- Kafka Connect + Iceberg sink
  connect:
    build:
      context: ./connect
    image: billing/connect-iceberg:local
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      <<: *s3-env
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/connectors || curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- Flink 2.2 on Java 17
  flink-jobmanager:
    image: flink:2.2.1-scala_2.12-java17
    command: jobmanager
    depends_on:
      create-buckets:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment: &flink-env
      <<: *s3-env
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.2.1.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend.type: rocksdb
        execution.checkpointing.dir: s3://flink/checkpoints
        execution.checkpointing.interval: 20s
        execution.checkpointing.mode: EXACTLY_ONCE
        s3.endpoint: http://seaweedfs:8333
        s3.path.style.access: true
        s3.access-key: billing
        s3.secret-key: billing-local-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    image: flink:2.2.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment: *flink-env

  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- Stripe CLI (optional)
  stripe-cli:
    profiles: [stripe]
    image: stripe/stripe-cli:v1.55.6
    command: listen --forward-to http://host.docker.internal:8085/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}  # a Stripe test-mode key; make up-stripe checks it is set
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------- Observability
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.5
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  # ---------------------------------------------------------------- Fault injection
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"   # API
      - "19093:19093" # Kafka via proxy (internal listener only)
      - "15432:15432" # Postgres via proxy
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro

volumes:
  kafka-data:
  seaweedfs-data:
  postgres-data:
