# Single source of versions. Resolved 2026-11-01; see docs/decisions/0001-versions.md.
[versions]
kafka = "4.3.2"
flink = "2.2.1"
flinkKafkaConnector = "5.0.0-2.2"
ratis = "3.2.2"
springBoot = "4.1.2"
springDependencyManagement = "1.1.7"
grpc = "1.85.1"
protobuf = "4.36.2"
protobufPlugin = "0.10.0"
postgresJdbc = "42.7.14"
flyway = "13.12.0"
stripe = "34.1.0"
iceberg = "1.12.0"
lettuce = "7.9.0.RELEASE"
micrometer = "1.17.2"
opentelemetry = "1.67.0"
slf4j = "2.0.20"
jakartaAnnotation = "3.0.0"
junit = "6.1.3"
assertj = "3.27.7"
jqwik = "1.10.2"
archunit = "1.5.1"
testcontainers = "2.0.5"
jmh = "1.37"
jmhPlugin = "0.7.4"
shadow = "9.6.1"
spotless = "8.10.4"
googleJavaFormat = "2.0.0"
