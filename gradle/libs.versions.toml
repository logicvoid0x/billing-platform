flink-connector-files = { module = "org.apache.flink:flink-connector-files", version.ref = "flink" }
flink-connector-kafka = { module = "org.apache.flink:flink-connector-kafka", version.ref = "flinkKafkaConnector" }
flink-statebackend-rocksdb = { module = "org.apache.flink:flink-statebackend-rocksdb", version.ref = "flink" }
flink-table-runtime = { module = "org.apache.flink:flink-table-runtime", version.ref = "flink" }
flink-table-api-java-bridge = { module = "org.apache.flink:flink-table-api-java-bridge", version.ref = "flink" }
flink-test-utils = { module = "org.apache.flink:flink-test-utils", version.ref = "flink" }
ratis-server = { module = "org.apache.ratis:ratis-server", version.ref = "ratis" }
ratis-grpc = { module = "org.apache.ratis:ratis-grpc", version.ref = "ratis" }
ratis-metrics-default = { module = "org.apache.ratis:ratis-metrics-default", version.ref = "ratis" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-netty = { module = "io.grpc:grpc-netty-shaded" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
grpc-protoc-plugin = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresJdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
stripe-java = { module = "com.stripe:stripe-java", version.ref = "stripe" }
iceberg-flink-runtime = { module = "org.apache.iceberg:iceberg-flink-runtime-2.2", version.ref = "iceberg" }
iceberg-data = { module = "org.apache.iceberg:iceberg-data", version.ref = "iceberg" }
hadoop-client-api = { module = "org.apache.hadoop:hadoop-client-api", version.ref = "hadoop" }
hadoop-client-runtime = { module = "org.apache.hadoop:hadoop-client-runtime", version.ref = "hadoop" }
iceberg-parquet = { module = "org.apache.iceberg:iceberg-parquet", version.ref = "iceberg" }
iceberg-core = { module = "org.apache.iceberg:iceberg-core", version.ref = "iceberg" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
micrometer-bom = { module = "io.micrometer:micrometer-bom", version.ref = "micrometer" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotation" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy" }
